name: WhatsApp Checker

on:
  workflow_dispatch:
    inputs:
      manual_numbers:
        description: 'Manual numbers separated by commas'
        required: false
        default: ''

jobs:
  check-whatsapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WhatsApp checker
        run: python whatsapp_checker.py
        env:
          INPUT_MANUAL_NUMBERS: ${{ github.event.inputs.manual_numbers }}
          INPUT_CSV_FILE: numbers.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-results
          path: results.csv
